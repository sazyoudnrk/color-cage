  miniWheelCanvas.addEventListener('click', () => openPopup('colorwheel', '色相環 / 選択色', buildColorWheelPopupContent));
  miniSLCanvas.addEventListener('click', () => openPopup('colorwheel', '色相環 / 選択色', buildColorWheelPopupContent));

  // ========================================================================
  // カラーパレット生成
  // 内部表現: 既存実装(HSL文字列)を踏襲。色相は必ず0〜360°へ正規化する。
  // 不透明度(Alpha)はここでは一切ランダム化しない(常に不透明な色を生成)。
  // ========================================================================

  function normHue(h) { return ((h % 360) + 360) % 360; }
  function rnd(min, max) { return min + Math.random() * (max - min); }
  function pm(delta) { return delta * (Math.random() < 0.5 ? -1 : 1); } // ±delta

  function hslColor(h, s, l) {
    return `hsl(${normHue(h).toFixed(1)}, ${clampNum(s, 0, 100).toFixed(0)}%, ${clampNum(l, 0, 100).toFixed(0)}%)`;
  }

  // ---- 「色の種類」: 彩度・明度の範囲を決定 ----
  // ※パステルの s/l レンジは手動調整済みのため変更しない
  const COLOR_TYPES = {
    full:   { label: '全色',       s: [20, 100], l: [15, 85] },
    vivid:  { label: 'ビビット',   s: [70, 100], l: [40, 70] },
    // くすみ: S上限が60だと鮮やかな色が混ざるため45までに抑える
    muted:  { label: 'くすみ',     s: [18, 45],  l: [45, 72] },
    // パステル: L上限100だとほぼ白の色が量産されるため88止まりにし、
    // かわりに彩度を上げて「薄いが色味のある」帯にする
    pastel: { label: 'パステル',   s: [40, 75],  l: [78, 88] },
  };

  // ---- 「色相の選択」: 色相環上の関係と色数を決定 ----
  // ランダム幅は hueJitterSettings を見て都度参照する(設定パネルから変更可能)
  const HUE_TYPES = {
    square: {
      label: '四角(4色)', count: 4,
      gen: (baseH) => {
        const d = hueJitterSettings.square;
        const H1 = baseH == null ? rnd(0, 360) : baseH;
        return [H1, H1 + 90 + pm(rnd(5, d)), H1 + 180 + pm(rnd(5, d)), H1 + 270 + pm(rnd(5, d))];
      },
    },
    triangle: {
      label: '三角(3色)', count: 3,
      gen: (baseH) => {
        const d = hueJitterSettings.triangle;
        const H1 = baseH == null ? rnd(0, 360) : baseH;
        return [H1, H1 + 120 + pm(rnd(5, d)), H1 + 240 + pm(rnd(5, d))];
      },
    },
    complement: {
      label: '補色(2色)', count: 2,
      gen: (baseH) => {
        const d = hueJitterSettings.complement;
        const H1 = baseH == null ? rnd(0, 360) : baseH;
        return [H1, H1 + 180 + pm(rnd(5, d))];
      },
    },
    broom: {
      label: 'ほうき(4色)', count: 4,
      gen: (baseH) => {
        const d = hueJitterSettings.broom;
        const H1 = baseH == null ? rnd(0, 360) : baseH, A = rnd(20, 60);
        return [H1, H1 + 180, H1 + A + pm(rnd(5, d)), H1 - A + pm(rnd(5, d))];
      },
    },
    analogous: {
      label: '同系色(3色)', count: 3,
      // ほうきから補色(H1+180)の枝を取り除いた形。基準色とその左右の近い色相だけで構成する
      gen: (baseH) => {
        const d = hueJitterSettings.analogous;
        const H1 = baseH == null ? rnd(0, 360) : baseH, A = rnd(20, 60);
        return [H1, H1 + A + pm(rnd(5, d)), H1 - A + pm(rnd(5, d))];
      },
    },
    random: {
      label: 'ランダム(4色)', count: 4,
      gen: (baseH) => [baseH == null ? rnd(0, 360) : baseH, rnd(0, 360), rnd(0, 360), rnd(0, 360)], // 色相関係を持たせない。ランダム幅設定の対象外
    },
  };

  // ---- 2軸を組み合わせて最終パレットを生成 ----
  // ---- 一部固定モード ----
  // 固定するのは「色相(H)」のみ。彩度・明度は現在の色の種類のレンジから毎回ランダムに決まる。
  let fixCount = 0;                              // 0=なし / 1=1色固定 / 2=2色固定
  let fixedColors = ['#e63946', '#4361ee'];      // 固定色(HEX)。Hだけを使う

  // 色相環上の最短角度差
  function hueDiff(a, b) {
    const d = Math.abs(normHue(a) - normHue(b));
    return Math.min(d, 360 - d);
  }

  // 既存の色相ルールをそのまま使い、固定色相を反映した色相配列を返す
  function generateHues(ht) {
    const fixedHues = fixedColors.slice(0, fixCount).map(c => hexToHsl(c).h);
    // 1色目は各ルールの基準色相(H1)として渡す。ルール側の計算式は変更しない
    const hues = ht.gen(fixedHues.length ? fixedHues[0] : null);
    if (fixedHues.length < 2) return hues;

    // 2色目は、ルールが生成した色相のうち最も近いものと差し替える。
    // こうすると配色ルールの形をできるだけ保ったまま、固定色を必ず含められる。
    // ルールを完全に満たせない場合でも固定色を優先する(エラーにしない)。
    let bestIdx = 1, bestD = Infinity;
    for (let i = 1; i < hues.length; i++) {
      const d = hueDiff(hues[i], fixedHues[1]);
      if (d < bestD) { bestD = d; bestIdx = i; }
    }
    if (hues.length >= 2) hues[bestIdx] = fixedHues[1];
    else hues.push(fixedHues[1]);
    return hues;
  }

  // 色の種類 → 彩度・明度の範囲 / 色相の選択 → 色相環上の関係、を独立に決定する
  // 明度(L)は「明度を揃える」がOFFなら色ごとに独立してレンジ全体からランダム、
  // ONならパレット全体で1回だけ決定して全色に適用する。
  // 彩度(S)は既存仕様どおり、ベース値を1回決め各色に±10のジッターを乗せる。
  function generatePalette(colorTypeKey, hueTypeKey) {
    const ct = COLOR_TYPES[colorTypeKey];
    const ht = HUE_TYPES[hueTypeKey];
    const hues = generateHues(ht);
    const baseS = rnd(ct.s[0], ct.s[1]);
    const sharedL = matchLightness ? rnd(ct.l[0], ct.l[1]) : null;
    return hues.map(H => {
      const S = clampNum(baseS + pm(rnd(0, 10)), ct.s[0], ct.s[1]);
      const L = matchLightness ? sharedL : rnd(ct.l[0], ct.l[1]);
      return hslColor(H, S, L);
    });
  }

  // 定番パレット(固定色。既存機能をそのまま維持)
  const DEFAULT_PALETTE = [
    '#111111', '#f2f0ea', '#e63946', '#f4a261',
    '#ffd166', '#2a9d8f', '#264653', '#4361ee',
    '#7b2cbf', '#ff70a6', '#8d6a4f', '#adb5bd'
  ];

  function buildSwatches(colors) {
    currentPaletteColors = colors;
    swatchWrap.innerHTML = '';
    colors.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c;
      b.style.color = c;
      b.addEventListener('click', () => selectColor(c, b));
      swatchWrap.appendChild(b);
    });
    selectColor(colors[0], swatchWrap.children[0]);
    // 新しいパレットになったら、セレクト指定のうち今のパレットに無い色は解除する
    ROLE_KEYS.forEach(key => {
      const cfg = roleConfig[key];
      if (cfg.mode === 'select' && cfg.color && !colors.includes(cfg.color)) cfg.color = null;
    });
    activeSchemeIndex = 0;
    refreshColorSchemes();
  }

  function selectColor(c, btn) {
    currentColor = c;
    [...swatchWrap.children].forEach(el => el.classList.remove('active'));
    if (btn) btn.classList.add('active');
    updateMiniColorWidgets();
    // 色を選んだら自動的にペンツールに戻す(消しゴムのままだと分かりにくいので)
    if (currentTool === 'eraser') setTool('pen');
  }

  // ========================================================================
  // おすすめ配色(ベース60% / アソート30% / アクセント10%)
  // 既存のパレット生成ロジックには手を加えず、その結果を評価して提案するだけ。
  // 選抜されなかった色もパレットからは削除せず、引き続き使用可能なままにする。
  // ========================================================================
  const schemeWrap = document.getElementById('scheme-wrap');
  const schemeConfigBtn = document.getElementById('scheme-config-btn');

  let colorSchemes = [];      // [{colors:[...], ratios:[...]}, ...]
  let activeSchemeIndex = 0;
  // 各役割の決定方法。mode: 'random' | 'select'、colorはselect時に固定する色
  const roleConfig = {
    base:   { mode: 'random', color: null },
    assort: { mode: 'random', color: null },
    accent: { mode: 'random', color: null },
  };
  const ROLE_KEYS = ['base', 'assort', 'accent'];
  const ROLE_LABELS = { base: 'ベース', assort: 'アソート', accent: 'アクセント' };

  // 色同士の距離。色相だけでなく彩度・明度も加味する。
  // 色相が近くても明度/彩度が大きく違えば「使い分けられる色」とみなす。
  function colorDistance(c1, c2) {
    const a = parseColorToHSL(c1), b = parseColorToHSL(c2);
    let dh = Math.abs(a.h - b.h);
    if (dh > 180) dh = 360 - dh;      // 色相環上の最短距離(0〜180)
    const hueTerm = (dh / 180) * 100;  // 0〜100に正規化
    const ds = Math.abs(a.s - b.s);
    const dl = Math.abs(a.l - b.l);
    // 彩度・明度の差は絵の中での使い分けやすさに直結するため重みを高めにとる
    return Math.sqrt(hueTerm * hueTerm + ds * ds * 1.4 + dl * dl * 1.6);
  }

  // 候補の中から、互いの距離が大きくなる3色を貪欲法で選ぶ。
  // fixed には select 指定で固定された色が入り、必ず結果に含める。
  function pickDistinctColors(candidates, count, fixed = []) {
    const picked = [...fixed];
    const pool = candidates.filter(c => !picked.includes(c));
    while (picked.length < count && pool.length) {
      let bestColor = null, bestScore = -1;
      pool.forEach(c => {
        // 既に選んだ色との最小距離が最大になる色を選ぶ(同系色の重複を避ける)
        const score = picked.length
          ? Math.min(...picked.map(p => colorDistance(c, p)))
          : parseColorToHSL(c).s; // 最初の1色は彩度が高いものを主役に選びやすくする
        if (score > bestScore) { bestScore = score; bestColor = c; }
      });
      picked.push(bestColor);
      pool.splice(pool.indexOf(bestColor), 1);
    }
    return picked;
  }

  // 色数に応じた比率を返す
  function ratiosFor(n) {
    if (n <= 1) return [100];
    if (n === 2) return [70, 30];
    return [60, 30, 10];
  }

  // roleConfigのselect指定を反映しつつ、残りをランダム(=自動選抜)で埋める
  // autoColors: 呼び出し側が選抜済みの候補色。paletteはselect指定の有効性チェックにのみ使う
  // prevPlacement: 前案の役割配置(色→枠index)。同じ色が続けて選ばれた場合、
  //   同じ枠に置かないようにして「同じ色の別の使い方」を提示する。
  //   select指定の色は役割が固定なのでこの回避の対象外。
  function applyRoleConfig(autoColors, palette, prevPlacement) {
    if (autoColors.length < 3) return autoColors; // 2色以下は役割割当をしない
    const result = [null, null, null];
    ROLE_KEYS.forEach((key, i) => {
      const cfg = roleConfig[key];
      if (cfg.mode === 'select' && cfg.color && palette.includes(cfg.color)) {
        result[i] = cfg.color;
      }
    });
    const fixed = result.filter(Boolean);
    // 候補はautoColorsに限定する。ここでpaletteを見てしまうと呼び出し側の選抜
    // (例: 案2に未使用色を必ず含める)が破棄され、案1と同じ結果になってしまう
    const pool = [...fixed, ...autoColors.filter(c => !fixed.includes(c))];
    const filled = pickDistinctColors(pool, 3, fixed);
    const rest = filled.filter(c => !fixed.includes(c));
    const slots = [0, 1, 2].filter(i => !result[i]);

    // 空き枠への並べ方を全通り試し、前案と同じ枠に来る色が最も少ない並びを採る。
    // 枠は3つしかないため回避しきれない場合もあるが、その時は衝突数が最小のものを選ぶ。
    // 衝突数が同じ並びが複数あるときはランダムに選ぶ。ここを決め打ちにすると、
    // 前案に無い色(=どこに置いても衝突しない)が毎回同じ枠に落ちて偏る。
    let bestConflicts = Infinity;
    let bestOrders = [rest];
    permutations(rest).forEach(order => {
      let conflicts = 0;
      order.forEach((color, k) => {
        if (prevPlacement && prevPlacement.get(color) === slots[k]) conflicts++;
      });
      if (conflicts < bestConflicts) { bestConflicts = conflicts; bestOrders = [order]; }
      else if (conflicts === bestConflicts) { bestOrders.push(order); }
    });
    const chosen = bestOrders[Math.floor(Math.random() * bestOrders.length)];

    slots.forEach((slot, k) => { result[slot] = chosen[k]; });
    return result.filter(Boolean);
  }

  // 配列の全順列を返す(要素数は最大3なので総当たりで十分)
  function permutations(arr) {
    if (arr.length <= 1) return [arr];
    const out = [];
    arr.forEach((item, i) => {
      const restItems = [...arr.slice(0, i), ...arr.slice(i + 1)];
      permutations(restItems).forEach(p => out.push([item, ...p]));
    });
    return out;
  }

  // 案の色配置を「色→枠index」のMapにする(次案で同じ枠を避けるために使う)
  function placementOf(colors) {
    const map = new Map();
    colors.forEach((c, i) => map.set(c, i));
    return map;
  }

  function buildColorSchemes(palette) {
    const n = palette.length;
    if (n === 0) return [];

    // 3色以下は生成色をそのまま使う(補色2色に第三色を作ったりはしない)
    if (n <= 3) {
      const colors = applyRoleConfig(palette, palette);
      return [{ colors, ratios: ratiosFor(colors.length) }];
    }

    // 4色は特殊：案1は差の大きい3色、案2は必ず未使用色 + 残りから2色
    if (n === 4) {
      // 案1はパレット全体から選抜(select固定色があればそれを含めて構成される)
      const plan1 = applyRoleConfig(palette, palette);
      // 案1で使われなかった1色(4色中3色を使うので必ず1つ残る)
      const unused = palette.filter(c => !plan1.includes(c))[0];
      // その未使用色を必ず含め、残り3色から差の大きい2色を足して案2にする
      const others = palette.filter(c => c !== unused);
      const twoMore = pickDistinctColors(others, 2);
      // 案1の配置を渡し、案1から続投する色は別の枠(60/30/10)に置き直す
      const plan2 = applyRoleConfig([unused, ...twoMore], palette, placementOf(plan1));

      return [
        { colors: plan1, ratios: ratiosFor(plan1.length) },
        { colors: plan2, ratios: ratiosFor(plan2.length) },
      ];
    }

    // 5色以上は、差の大きい3色で案1を作る
    const plan1 = applyRoleConfig(palette, palette);
    // 案2は案1で使わなかった色を中心に構成し、足りなければ案1の色も借りる
    const leftovers = palette.filter(c => !plan1.includes(c));
    let plan2Source = leftovers;
    if (leftovers.length < 3) {
      plan2Source = [...leftovers, ...palette.filter(c => !leftovers.includes(c))];
    }
    const plan2 = applyRoleConfig(pickDistinctColors(plan2Source, 3), palette, placementOf(plan1));

    const schemes = [{ colors: plan1, ratios: ratiosFor(plan1.length) }];
    // 案1と全く同じ組み合わせにならない場合のみ案2を追加する
    // (色も配置も同一なら別案として意味がないため、配置まで含めて比較する)
    const same = plan2.length === plan1.length && plan2.every((c, i) => plan1[i] === c);
    if (!same) schemes.push({ colors: plan2, ratios: ratiosFor(plan2.length) });
    return schemes;
  }

  function renderColorSchemes() {
    schemeWrap.innerHTML = '';
    if (!colorSchemes.length) {
      const p = document.createElement('div');
      p.className = 'scheme-empty';
      p.textContent = 'おすすめ配色なし';
      schemeWrap.appendChild(p);
      return;
    }
    colorSchemes.forEach((scheme, idx) => {
      const bar = document.createElement('div');
      bar.className = 'scheme-bar' + (idx === activeSchemeIndex ? ' active' : '');
      scheme.colors.forEach((c, i) => {
        const seg = document.createElement('div');
        seg.className = 'scheme-seg';
        seg.style.background = c;
        seg.style.width = `${scheme.ratios[i]}%`;
        // 明度に応じて読みやすい文字色を選ぶ
        seg.style.color = parseColorToHSL(c).l > 55 ? '#00000099' : '#ffffffcc';
        seg.textContent = `${scheme.ratios[i]}%`;
        // バーの色をタップすると、その色を描画色として選べる
        seg.addEventListener('click', (e) => {
          e.stopPropagation();
          activeSchemeIndex = idx;
          selectColorByValue(c);
          renderColorSchemes();
        });
        bar.appendChild(seg);
      });
      bar.addEventListener('click', () => {
        activeSchemeIndex = idx;
        renderColorSchemes();
      });
      schemeWrap.appendChild(bar);
    });
  }

  function refreshColorSchemes() {
    colorSchemes = buildColorSchemes(currentPaletteColors);
    if (activeSchemeIndex >= colorSchemes.length) activeSchemeIndex = 0;
    renderColorSchemes();
  }

  // パレット上の色を値で選択する(配色バーからの選択用)
  function selectColorByValue(c) {
    const idx = currentPaletteColors.indexOf(c);
    if (idx >= 0 && swatchWrap.children[idx]) {
      selectColor(c, swatchWrap.children[idx]);
    } else {
      selectColor(c, null);
    }
  }

  // ---- 配色の指定パネル(役割ごとに ランダム / セレクト を切り替える) ----
  function buildSchemeConfigContent(container) {
    const note = document.createElement('div');
    note.className = 'scheme-empty';
    note.textContent = '各役割を「セレクト」にすると色を固定でき、「ランダム」の枠はアプリが自動で選びます。';
    container.appendChild(note);

    ROLE_KEYS.forEach(key => {
      const cfg = roleConfig[key];
      const row = document.createElement('div');
      row.className = 'popup-slider-row';

      const head = document.createElement('div');
      head.className = 'popup-slider-head';
      const name = document.createElement('span');
      name.textContent = ROLE_LABELS[key];
      const modeBtns = document.createElement('span');
      modeBtns.className = 'role-mode-btns';
      [['random', 'ランダム'], ['select', 'セレクト']].forEach(([mode, label]) => {
        const b = document.createElement('button');
        b.className = 'icon-btn pen-btn' + (cfg.mode === mode ? ' active' : '');
        b.textContent = label;
        b.addEventListener('click', () => {
          cfg.mode = mode;
          if (mode === 'random') cfg.color = null;
          refreshColorSchemes();
          refreshPopupIfType('scheme');
        });
        modeBtns.appendChild(b);
      });
      head.appendChild(name);
      head.appendChild(modeBtns);
      row.appendChild(head);

      if (cfg.mode === 'select') {
        const sw = document.createElement('div');
        sw.className = 'role-picker-swatches';
        currentPaletteColors.forEach(c => {
          const b = document.createElement('button');
          b.className = 'role-picker-swatch' + (cfg.color === c ? ' active' : '');
          b.style.background = c;
          b.addEventListener('click', () => {
            cfg.color = c;
            refreshColorSchemes();
            refreshPopupIfType('scheme');
          });
          sw.appendChild(b);
        });
        row.appendChild(sw);
      }
      container.appendChild(row);
    });
  }
  schemeConfigBtn.addEventListener('click', () => openPopup('scheme', '配色案の指定', buildSchemeConfigContent));

  let useDefaultPalette = false;

  // ========================================================================
  // パレットモード: ランダム生成 or ユーザーによるセレクト
  // ========================================================================
  let paletteMode = 'random'; // 'random' | 'select'
  // セレクトに入る直前のパレット状態。解除時に再抽選せずここへ戻す。
  let paletteStateBeforeSelect = null; // null | {colors, selected, modeLabel}
  // セレクト色はユーザー指定値をそのまま保持する(H/S/Lの再計算はしない)
  let selectColors = ['#e63946'];

  // ========================================================================
  // パレットヒストリー: 「抽選」で確定したパレットだけを最大5件保持する。
  // セレクトモードでの確定や定番パレットは抽選ではないため対象外。
  // アプリ内メモリのみに保持し、永続化はしない(要求どおり)。
  // ========================================================================
  const PALETTE_HISTORY_MAX = 5;
  let paletteHistory = []; // 先頭が最新。[{colors:[...]}]

  function pushPaletteHistory(colors) {
    // 同一構成でも要求どおり別履歴として積む(参照ではなく値のコピーを保存)
    paletteHistory.unshift({ colors: colors.slice() });
    if (paletteHistory.length > PALETTE_HISTORY_MAX) paletteHistory.length = PALETTE_HISTORY_MAX;
  }

  function applyPalette() {
    if (paletteMode === 'select') {
      // セレクトモード: ユーザー指定色をそのまま使う。色相ルールやランダム
      // レンジ補正は一切適用しない(要求どおり値を変更しない)。
      modeLabel.textContent = `セレクト(${selectColors.length}色)`;
      buildSwatches(selectColors.slice());
      return;
    }
    if (useDefaultPalette) {
      modeLabel.textContent = '定番パレット';
      shuffleBtn.style.display = 'none';
      colorTypeSelect.disabled = true;
      hueTypeSelect.disabled = true;
      buildSwatches(DEFAULT_PALETTE);
    } else {
      const colorTypeKey = colorTypeSelect.value;
      const hueTypeKey = hueTypeSelect.value;
      modeLabel.textContent = `${COLOR_TYPES[colorTypeKey].label}・${HUE_TYPES[hueTypeKey].label}`;
      shuffleBtn.style.display = 'flex';
      colorTypeSelect.disabled = false;
      hueTypeSelect.disabled = false;
      const colors = generatePalette(colorTypeKey, hueTypeKey);
      buildSwatches(colors);
      // 「抽選によって生成された」パレットのみ履歴の対象(定番・セレクトは対象外)
      pushPaletteHistory(colors);
    }
  }

  // ---- パレットモード(ランダム/セレクト)の切り替え ----
  function applyPaletteModeUI() {
    const isSelect = paletteMode === 'select';
    paletteModeToggle.classList.toggle('active', isSelect);
    paletteModeToggle.textContent = isSelect ? 'セレクト中' : 'セレクト';
    // ランダム生成専用のUIをまとめて無効化する
    colorTypeSelect.disabled = isSelect || useDefaultPalette;
    hueTypeSelect.disabled = isSelect || useDefaultPalette;
    shuffleBtn.disabled = isSelect;
    fixBtn.disabled = isSelect;
    defaultToggleBtn.disabled = isSelect;
    [colorTypeSelect, hueTypeSelect, shuffleBtn, fixBtn, defaultToggleBtn].forEach(el => {
      el.style.opacity = (isSelect && el !== paletteModeToggle) ? '0.4' : '';
      el.style.pointerEvents = (isSelect && el !== paletteModeToggle) ? 'none' : '';
    });
    // ✏️編集はセレクト時のみ出す(🎨背景の左に並ぶ)
    selectEditBtn.style.display = isSelect ? 'flex' : 'none';
  }

  // セレクトに入る直前のパレット状態。解除時に再抽選せずここへ戻す。

  paletteModeToggle.addEventListener('click', () => {
    if (paletteMode === 'random') {
      // セレクトへ入る: 現在のパレットと選択色を退避しておく
      paletteStateBeforeSelect = {
        colors: currentPaletteColors.slice(),
        selected: currentColor,
        modeLabel: modeLabel.textContent,
      };
      paletteMode = 'select';
      applyPaletteModeUI();
      applyPalette();
      return;
    }
    // セレクトを解除: 再抽選せず、入る前のパレットと選択色をそのまま戻す
    paletteMode = 'random';
    applyPaletteModeUI();
    if (paletteStateBeforeSelect && paletteStateBeforeSelect.colors.length) {
      buildSwatches(paletteStateBeforeSelect.colors.slice());
      // buildSwatches は先頭色を選ぶので、退避しておいた選択色に戻す
      const prev = paletteStateBeforeSelect.selected;
      if (prev && paletteStateBeforeSelect.colors.includes(prev)) selectColorByValue(prev);
      modeLabel.textContent = paletteStateBeforeSelect.modeLabel;
      paletteStateBeforeSelect = null;
    } else {
      applyPalette();
    }
  });

  colorTypeSelect.addEventListener('change', applyPalette);
  hueTypeSelect.addEventListener('change', applyPalette);
  shuffleBtn.addEventListener('click', applyPalette);
  defaultToggleBtn.addEventListener('click', () => {
    useDefaultPalette = !useDefaultPalette;
    defaultToggleBtn.classList.toggle('active', useDefaultPalette);
    applyPalette();
  });

  // ---------- ツール切り替え ----------
  function setTool(tool) {
    currentTool = tool;
    // ペンツール選択時に、消しゴム使用前のペンツール種類を記憶
    if (tool === 'pen' || tool === 'pen2') {
      penToolBeforeEraser = tool;
    }
    // スポイト待機中だけキャンバス以外を暗くし、案内を出す
    document.body.classList.toggle('eyedropping', tool === 'eyedropper');
    penBtns.forEach(b => b.classList.toggle('active', b.dataset.pen === tool));
    eraserBtn.classList.toggle('active', tool === 'eraser');
    bucketBtn.classList.toggle('active', tool === 'bucket');
    panToolBtn.classList.toggle('active', tool === 'pan');
  }
  penBtns.forEach(b => b.addEventListener('click', () => setTool(b.dataset.pen)));
  eraserBtn.addEventListener('click', () => setTool('eraser'));
  bucketBtn.addEventListener('click', () => setTool('bucket'));
  panToolBtn.addEventListener('click', () => setTool('pan'));


  sizeSlider.addEventListener('input', () => {
    sizeValueLabel.textContent = `${sizeSlider.value}px`;
  });

  // キャンバスサイズ表示(ヘッダー)を更新
  function updateCanvasSizeLabel() {
    const preset = CANVAS_SIZE_PRESETS[selectedCanvasSizeIndex];
    const label = document.getElementById('canvas-size-label');
    if (preset.width === null && importedCanvasSize) {
      label.textContent = `${importedCanvasSize.width}×${importedCanvasSize.height}`;
    } else if (preset.width === null) {
      label.textContent = '';
    } else {
      label.textContent = `${preset.width}×${preset.height}`;
    }
  }

  // ---------- キャンバスサイズ(解像度はズームに関係なくwrapの実サイズに固定) ----------
  function resizeAllCanvases() {
    const preset = CANVAS_SIZE_PRESETS[selectedCanvasSizeIndex];
    // 固定サイズが選択されている場合はそれを使う、そうでなければ画面サイズに合わせる
    let cssW, cssH;
    if (preset.width !== null) {
      cssW = preset.width;
      cssH = preset.height;
    } else if (importedCanvasSize) {
      // インポートした画像の寸法を維持する(画面サイズに引き伸ばさない)
      cssW = importedCanvasSize.width;
      cssH = importedCanvasSize.height;
    } else if (fitScreenBaseSize) {
      // 「画面に合わせる」の基準は、ツールバーを畳んだ状態(＝最も広い表示領域)。
      // 展開時の狭い領域を基準にすると、描いている途中で畳んだときに
      // キャンバスが広がってしまうため、起動時に測った値を使い続ける。
      cssW = fitScreenBaseSize.width;
      cssH = fitScreenBaseSize.height;
      // 画面回転で基準が測り直された場合でも、縮小はしない。
      // 縮めると、はみ出した部分の描画が復元できずに失われるため。
      const cur = layers[0] ? layers[0].canvas : null;
      if (cur) {
        cssW = Math.max(cssW, Math.round(parseFloat(cur.style.width) || 0));
        cssH = Math.max(cssH, Math.round(parseFloat(cur.style.height) || 0));
      }
    } else {
      const rect = wrap.getBoundingClientRect();
      cssW = Math.round(rect.width);
      cssH = Math.round(rect.height);
      // キャンバスを縮めると、はみ出した部分の描画が完全に失われる
      // (貼り戻しが左上基準の1:1コピーのため)。
      // ツールバーの開閉や画面回転で表示領域が狭くなっても縮小はせず、
      // これまでの最大サイズを保持する。狭い分は表示上クリップされるだけで、
      // 折りたたむ/パンすれば再び見える。
      const cur = layers[0] ? layers[0].canvas : null;
      if (cur) {
        cssW = Math.max(cssW, Math.round(parseFloat(cur.style.width) || 0));
        cssH = Math.max(cssH, Math.round(parseFloat(cur.style.height) || 0));
      }
    }

    dpr = Math.max(1, window.devicePixelRatio || 1);

    layers.forEach(layer => {
      const prev = document.createElement('canvas');
      prev.width = layer.canvas.width;
      prev.height = layer.canvas.height;
      if (prev.width > 0) prev.getContext('2d').drawImage(layer.canvas, 0, 0);

      layer.canvas.width = cssW * dpr;
      layer.canvas.height = cssH * dpr;
      // CSSの表示サイズも明示的に固定し、内部解像度との比率を必ずdprに保つ
      layer.canvas.style.width = cssW + 'px';
      layer.canvas.style.height = cssH + 'px';
      layer.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layer.ctx.lineCap = 'round';
      layer.ctx.lineJoin = 'round';
      layer.ctx.imageSmoothingEnabled = false; // アンチエイリアスの影響を可能な範囲で抑える

      if (prev.width > 0) {
        // 生ピクセル同士で1:1に貼り戻す(拡大縮小を挟まずズレを防ぐ)
        layer.ctx.save();
        layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
        layer.ctx.drawImage(prev, 0, 0);
        layer.ctx.restore();
      }
    });
    // #paperもキャンバスと同じ整数サイズに揃える
    paper.style.width = cssW + 'px';
    paper.style.height = cssH + 'px';
    // #stageはCSSでは100%だが、固定サイズプリセットではキャンバスの方が
    // 大きく(または小さく)なるため、実サイズに合わせておく
    stage.style.width = cssW + 'px';
    stage.style.height = cssH + 'px';
    clampPan();
    applyZoom();
  }

  // ---------- 座標変換: 画面座標 → ズーム/パンを考慮したキャンバス座標 ----------
  // 位置(原点)は実際の描画結果から測り、スケールはzoom変数をそのまま使う。
  // 以前は縦横それぞれの実測サイズを基準サイズで割ってスケールを求めていたが、
  // #canvas-wrapはflex:1で高さが決まるためサブピクセルの端数を持ちやすく、
  // その除算結果がzoomからわずかにズレて縦方向だけ誤差が拡大していた。
  function getPos(e) {
    // 基準は #stage。レイヤーcanvasを基準にすると、そのレイヤーを非表示
    // (display:none)にした瞬間に矩形が全て0になり、座標が大きくずれる。
    // #stage は常に表示されており、transform適用後の原点は
    // 各レイヤーcanvas(stage内の0,0に絶対配置)の原点と一致する。
    const originRect = stage.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: (t.clientX - originRect.left) / zoom,
      y: (t.clientY - originRect.top) / zoom,
      t: Date.now(),
    };
  }

  function strokeWidthFor() {
    const base = Number(sizeSlider.value);
    if (currentTool === 'pen') return Math.max(1, base * PEN_STYLES.pen.widthMul);
    if (currentTool === 'pen2') {
      // ペン2(正方形ドット)は strokeWidthFor で値を求めない(size スライダーをそのまま使う)
      return base;
    }
    return base;
  }

  function pushHistory(layer) {
    layer.undoStack.push(layer.canvas.toDataURL());
    if (layer.undoStack.length > 20) layer.undoStack.shift();
    layer.redoStack = [];
  }

  // ---------- バケツ塗り ----------
  const colorProbe = document.createElement('canvas');
  colorProbe.width = 1; colorProbe.height = 1;
  const colorProbeCtx = colorProbe.getContext('2d');
  function colorToRGBA(str) {
    colorProbeCtx.clearRect(0, 0, 1, 1);
    colorProbeCtx.fillStyle = str;
    colorProbeCtx.fillRect(0, 0, 1, 1);
    return colorProbeCtx.getImageData(0, 0, 1, 1).data;
  }

  function floodFillAt(layer, cssX, cssY, fillColorStr) {
    const canvas = layer.canvas;
    const w = canvas.width, h = canvas.height;
    const px = Math.floor(cssX * dpr);
    const py = Math.floor(cssY * dpr);
    if (px < 0 || py < 0 || px >= w || py >= h) return;

    const imgData = layer.ctx.getImageData(0, 0, w, h);
    const data = imgData.data;
    const fillColor = colorToRGBA(fillColorStr);

    const startIdx = (py * w + px) * 4;
    const target = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];

    if (Math.abs(target[0] - fillColor[0]) <= 4 &&
        Math.abs(target[1] - fillColor[1]) <= 4 &&
        Math.abs(target[2] - fillColor[2]) <= 4 &&
        Math.abs(target[3] - fillColor[3]) <= 4) {
      return;
    }

    const tolerance = 32;
    const tol2 = tolerance * tolerance;
    function matches(idx) {
      const dr = data[idx] - target[0];
      const dg = data[idx + 1] - target[1];
      const db = data[idx + 2] - target[2];
      const da = data[idx + 3] - target[3];
      return dr * dr + dg * dg + db * db + da * da <= tol2;
    }
    function setPixel(idx) {
      data[idx] = fillColor[0];
      data[idx + 1] = fillColor[1];
      data[idx + 2] = fillColor[2];
      data[idx + 3] = fillColor[3];
    }

    // 塗る画素をマスクに記録する(この時点ではまだピクセルを書き換えない)。
    // 走査線(スキャンライン)方式: 横方向は一括で処理し、スタックには
    // 行の区間だけを積む。1画素ずつ配列を積む方式に比べ生成する
    // オブジェクト数が桁違いに少なく、実機でも実用速度になる。
    const mask = new Uint8Array(w * h);
    const stack = [[px, py]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      const rowIdx = cy * w;
      if (mask[rowIdx + cx] || !matches((rowIdx + cx) * 4)) continue;

      let xl = cx;
      while (xl > 0 && !mask[rowIdx + xl - 1] && matches((rowIdx + xl - 1) * 4)) xl--;
      let xr = cx;
      while (xr < w - 1 && !mask[rowIdx + xr + 1] && matches((rowIdx + xr + 1) * 4)) xr++;

      for (let i = xl; i <= xr; i++) mask[rowIdx + i] = 1;

      [cy - 1, cy + 1].forEach(ny => {
        if (ny < 0 || ny >= h) return;
        const nRowIdx = ny * w;
        let i = xl;
        while (i <= xr) {
          if (!mask[nRowIdx + i] && matches((nRowIdx + i) * 4)) {
            stack.push([i, ny]);
            while (i <= xr && !mask[nRowIdx + i] && matches((nRowIdx + i) * 4)) i++;
          } else {
            i++;
          }
        }
      });
    }

    // 塗り範囲を1px膨張させてから書き込む。
    // 線画の境界はアンチエイリアスで半端な色になっており、そのまま塗ると
    // 不透明度100%でも輪郭に元の色が残って見える。1px重ねてこれを隠す。
    // 元のマスクを読みながら書き込むと膨張が連鎖するため、コピーを参照する。
    const src = mask.slice();
    for (let y = 0; y < h; y++) {
      const rowIdx = y * w;
      for (let x = 0; x < w; x++) {
        const idx = rowIdx + x;
        if (src[idx]) { setPixel(idx * 4); continue; }
        // 上下左右のいずれかが塗り範囲なら、この画素も塗る
        if ((x > 0 && src[idx - 1]) ||
            (x < w - 1 && src[idx + 1]) ||
            (y > 0 && src[idx - w]) ||
            (y < h - 1 && src[idx + w])) {
          setPixel(idx * 4);
        }
      }
    }

    layer.ctx.putImageData(imgData, 0, 0);
  }

  function restoreFromDataURL(layer, dataUrl) {
    const img = new Image();
    img.onload = () => {
      // CSS座標を経由せず生ピクセルのまま1:1で貼り戻す。
      // rect基準で貼り直すと、undoのたびに端数分の拡大縮小が入りズレが蓄積する。
      layer.ctx.save();
      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
      layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
      layer.ctx.drawImage(img, 0, 0);
      layer.ctx.restore();
    };
    img.src = dataUrl;
  }

  // ---------- 描画 / 単指パン(ツール選択時) ----------
  // ---------- スポイト(セレクトモード用) ----------
  // 見た目どおりの色を拾うため、レイヤーを個別に見るのではなく
  // 既存のmergeCanvas()(不透明度・背景色・重なり順を反映済み)から読み取る。
  function pickColorFromCanvas(e) {
    const p = getPos(e); // CSS座標(zoom/pan考慮済み、既存のgetPosをそのまま再利用)
    const merged = mergeCanvas();
    const px = Math.floor(p.x * dpr);
    const py = Math.floor(p.y * dpr);
    if (px < 0 || py < 0 || px >= merged.width || py >= merged.height) return;
    const mctx = merged.getContext('2d');
    const data = mctx.getImageData(px, py, 1, 1).data;
    const hex = '#' + [data[0], data[1], data[2]]
      .map(v => v.toString(16).padStart(2, '0')).join('');

    if (selectEditingIndex !== null && selectColors[selectEditingIndex] !== undefined) {
      selectColors[selectEditingIndex] = hex;
      selectEditingIndex = null;
      setTool(penToolBeforeEraser); // スポイト後は元のペンツールに戻す
      if (paletteMode === 'select') applyPalette();
      openPopup('select', 'セレクト色を編集', buildSelectEditPopupContent);
    }
  }

  // スポイトをやめて元のツールに戻す
  document.getElementById('eyedrop-cancel').addEventListener('click', () => {
    selectEditingIndex = null;
    setTool(penToolBeforeEraser);
    openPopup('select', 'セレクト色を編集', buildSelectEditPopupContent);
  });

  function start(e) {
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;

    if (currentTool === 'pan') {
      panStart = { x: t.clientX, y: t.clientY, panX, panY };
      drawing = true;
      return;
    }

    if (currentTool === 'eyedropper') {
      pickColorFromCanvas(e);
      drawing = false;
      return;
    }

    const layer = activeLayer();
    const p = getPos(e);

    if (currentTool === 'bucket') {
      pushHistory(layer);
      floodFillAt(layer, p.x, p.y, currentColor);
      drawing = false;
      return;
    }

    drawing = true;
    pushHistory(layer);
    rawPoint = { x: p.x, y: p.y };
    smoothPoint = { x: p.x, y: p.y };
    lastTime = p.t;

    if (currentTool === 'eraser') {
      layer.ctx.save();
      layer.ctx.globalCompositeOperation = 'destination-out';
      const size = Number(sizeSlider.value);
      if (penToolBeforeEraser === 'pen2') {
        // ペン2選択時は四角い消しゴム
        layer.ctx.fillRect(snap(p.x - size / 2), snap(p.y - size / 2), size, size);
      } else {
        // ペン選択時は円形の消しゴム
        layer.ctx.beginPath();
        layer.ctx.arc(snap(p.x), snap(p.y), (size * 1.4) / 2, 0, Math.PI * 2);
        layer.ctx.fill();
      }
      layer.ctx.restore();
    } else if (currentTool === 'pen2') {
      // 正方形ドット
      const size = Number(sizeSlider.value);
      layer.ctx.save();
      layer.ctx.fillStyle = currentColor;
      layer.ctx.fillRect(snap(p.x - size / 2), snap(p.y - size / 2), size, size);
      layer.ctx.restore();
    } else {
      // pen: 通常の円形ペン
      layer.ctx.save();
      layer.ctx.beginPath();
      layer.ctx.arc(snap(p.x), snap(p.y), strokeWidthFor() / 2, 0, Math.PI * 2);
      layer.ctx.fillStyle = currentColor;
      layer.ctx.fill();
      layer.ctx.restore();
    }
  }

  function move(e) {
    if (currentTool === 'pan') {
      if (!drawing || !panStart) return;
      e.preventDefault();
      const t = e.touches ? e.touches[0] : e;
      panX = panStart.panX + (t.clientX - panStart.x);
      panY = panStart.panY + (t.clientY - panStart.y);
      clampPan();
      applyZoom();
      return;
    }
    if (currentTool === 'bucket') return; // バケツはタップのみ
    if (currentTool === 'eyedropper') return; // スポイトもタップのみ(ドラッグで描画させない)
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    const dt = Math.max(1, p.t - lastTime);
    lastTime = p.t;

    const factor = SMOOTHING_LEVELS[smoothingIndex].factor;
    const prevSmooth = { x: smoothPoint.x, y: smoothPoint.y };
    smoothPoint.x += (p.x - smoothPoint.x) * factor;
    smoothPoint.y += (p.y - smoothPoint.y) * factor;

    if (currentTool === 'pen') {
      // ペン: ほんのり位置ジッター(スムージングされた線に細かい手ぶれ感を足す)
      smoothPoint.x += (Math.random() - 0.5) * 0.6;
      smoothPoint.y += (Math.random() - 0.5) * 0.6;
    }

    const layer = activeLayer();
    const fromX = snap(prevSmooth.x), fromY = snap(prevSmooth.y);
    const toX = snap(smoothPoint.x), toY = snap(smoothPoint.y);

    if (currentTool === 'eraser') {
      layer.ctx.save();
      layer.ctx.globalCompositeOperation = 'destination-out';
      const size = Number(sizeSlider.value);
      if (penToolBeforeEraser === 'pen2') {
        // ペン2選択時は四角い消しゴム
        const dx = toX - fromX, dy = toY - fromY;
        const dist = Math.hypot(dx, dy);
        const step = Math.max(1, Math.ceil(size / 2));
        for (let i = 0; i <= dist; i += step) {
          const t = dist > 0 ? i / dist : 0;
          const x = fromX + dx * t;
          const y = fromY + dy * t;
          layer.ctx.fillRect(snap(x - size / 2), snap(y - size / 2), size, size);
        }
      } else {
        // ペン選択時は円形の消しゴム
        layer.ctx.lineWidth = size * 1.4;
        layer.ctx.beginPath();
        layer.ctx.moveTo(fromX, fromY);
        layer.ctx.lineTo(toX, toY);
        layer.ctx.stroke();
      }
      layer.ctx.restore();
    } else if (currentTool === 'pen2') {
      // 正方形ドット: 始点から終点への直線に沿ってドットを敷く
      const size = Number(sizeSlider.value);
      const dx = toX - fromX, dy = toY - fromY;
      const dist = Math.hypot(dx, dy);
      const step = Math.max(1, Math.ceil(size / 2)); // ドット間隔(重ねられるように)
      layer.ctx.save();
      layer.ctx.fillStyle = currentColor;
      for (let i = 0; i <= dist; i += step) {
        const t = dist > 0 ? i / dist : 0;
        const x = fromX + dx * t;
        const y = fromY + dy * t;
        layer.ctx.fillRect(snap(x - size / 2), snap(y - size / 2), size, size);
      }
      layer.ctx.restore();
    } else {
      // ペン: 通常の円形ストローク
      layer.ctx.save();
      layer.ctx.strokeStyle = currentColor;
      layer.ctx.lineWidth = strokeWidthFor();
      layer.ctx.beginPath();
      layer.ctx.moveTo(fromX, fromY);
      layer.ctx.lineTo(toX, toY);
      layer.ctx.stroke();
      layer.ctx.restore();
    }
  }

  function end() {
    drawing = false;
    panStart = null;
  }

  // 描画中に(実際に何か描く前の)ストロークが2本指操作へ切り替わった場合、
  // start()で積んだ履歴を巻き戻して「うっかり点が残る」のを防ぐ
  function cancelActiveStroke() {
    if (!drawing || currentTool === 'pan') { drawing = false; panStart = null; return; }
    const layer = activeLayer();
    if (layer.undoStack.length) {
      const snapshot = layer.undoStack.pop();
      restoreFromDataURL(layer, snapshot);
    }
    drawing = false;
  }

  // ---------- マウス(デスクトップ用、単指相当) ----------
  wrap.addEventListener('mousedown', start);
  wrap.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);

  // ========================================================================
  // タッチ: 1本指=描画 / 2本指=パン+ピンチズーム(同時対応)
  // ========================================================================
  const touchPoints = new Map(); // identifier -> {x,y}
  let gestureMode = null; // null | 'draw' | 'pinch'
  let pinchState = null;

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  function onTouchStart(e) {
    for (const t of e.changedTouches) touchPoints.set(t.identifier, { x: t.clientX, y: t.clientY });

    if (touchPoints.size === 1 && gestureMode === null) {
      e.preventDefault();
      gestureMode = 'draw';
      start(e);
    } else if (touchPoints.size === 2) {
      e.preventDefault();
      if (gestureMode === 'draw') cancelActiveStroke();
      gestureMode = 'pinch';
      const pts = [...touchPoints.values()];
      pinchState = {
        startDist: dist(pts[0], pts[1]),
        startZoom: zoom,
        startMid: mid(pts[0], pts[1]),
        startPanX: panX,
        startPanY: panY,
      };
    } else if (touchPoints.size > 2) {
      e.preventDefault(); // 3本目以降は無視(既存の2本指ジェスチャーを継続)
    }
  }

  function onTouchMove(e) {
    for (const t of e.changedTouches) if (touchPoints.has(t.identifier)) touchPoints.set(t.identifier, { x: t.clientX, y: t.clientY });

    if (gestureMode === 'draw' && touchPoints.size === 1) {
      e.preventDefault();
      move(e);
    } else if (gestureMode === 'pinch' && touchPoints.size >= 2 && pinchState) {
      e.preventDefault();
      const pts = [...touchPoints.values()].slice(0, 2);
      const newDist = dist(pts[0], pts[1]);
      const newMid = mid(pts[0], pts[1]);
      const ratio = newDist / Math.max(1, pinchState.startDist);
      zoom = clampNum(pinchState.startZoom * ratio, ZOOM_MIN, ZOOM_MAX);

      const rect = wrap.getBoundingClientRect();
      const anchorX = pinchState.startMid.x - rect.left;
      const anchorY = pinchState.startMid.y - rect.top;
      // ピンチ開始点(アンカー)のステージ座標を維持しつつ、中点の移動量をパンとして反映する
      const stageLocalX = (anchorX - pinchState.startPanX) / pinchState.startZoom;
      const stageLocalY = (anchorY - pinchState.startPanY) / pinchState.startZoom;
      const newAnchorX = newMid.x - rect.left;
      const newAnchorY = newMid.y - rect.top;
      panX = newAnchorX - stageLocalX * zoom;
      panY = newAnchorY - stageLocalY * zoom;
      clampPan();
      applyZoom();
    }
  }

  function onTouchEnd(e) {
    for (const t of e.changedTouches) touchPoints.delete(t.identifier);

    if (gestureMode === 'draw') {
      end();
    } else if (gestureMode === 'pinch' && touchPoints.size < 2) {
      pinchState = null;
    }
    if (touchPoints.size === 0) { gestureMode = null; pinchState = null; }
  }

  wrap.addEventListener('touchstart', onTouchStart, { passive: false });
  wrap.addEventListener('touchmove', onTouchMove, { passive: false });
  wrap.addEventListener('touchend', onTouchEnd, { passive: false });
  wrap.addEventListener('touchcancel', onTouchEnd, { passive: false });

  // ---------- 保存 ----------
  function mergeCanvas() {
    const out = document.createElement('canvas');
    out.width = layers[0].canvas.width;
    out.height = layers[0].canvas.height;
    const octx = out.getContext('2d');
    octx.imageSmoothingEnabled = false;
    // 画面の #paper と同じ背景色で塗る(白固定にすると背景色の設定が出力に反映されない)
    octx.fillStyle = canvasBgColor;
    octx.fillRect(0, 0, out.width, out.height);
    // 合成順は配列順(=z-index順)。画面の重なりと一致させる。
    layers.forEach(layer => {
      if (!layer.visible) return;
      // レイヤーごとの不透明度も反映する
      const op = parseFloat(layer.canvas.style.opacity);
      octx.globalAlpha = isNaN(op) ? 1 : op;
      octx.drawImage(layer.canvas, 0, 0);
    });
    octx.globalAlpha = 1;
    return out;
  }

  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // ---------- 出力(パレット資料 / 画像 / 両方) ----------
  // 色計算は一切やり直さず、画面に表示中の currentPaletteColors と colorSchemes を
  // そのまま描画する。別ロジックを持つと画面と出力で色が食い違うため。
  const EXPORT_W = 1080;
  let exportMode = 'both'; // 'palette' | 'image' | 'both'
  let exportPaletteSize = 'compact'; // 'standard' | 'compact'

  function colorToHex(c) {
    if (c.startsWith('#')) return c.toUpperCase();
    const { h, s, l } = parseColorToHSL(c);
    const [r, g, b] = hslToRgb(h, s, l);
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  // 背景色の明度に応じて読みやすい文字色を返す(画面側の配色バーと同じ判断基準)
  function readableInk(c) {
    return parseColorToHSL(c).l > 55 ? '#00000099' : '#ffffffdd';
  }

  // パレット部分のレイアウト寸法を先に算出する(描画と高さ計算で同じ値を使う)
  function paletteLayout(width, colors, schemes, compact = false) {
    const pad = compact ? 30 : 48;
    const gap = compact ? 16 : 24;
    const inner = width - pad * 2;
    // スウォッチは「色を見る」ことが主目的なので大きめを確保する。
    // コンパクトは絵に添える資料なので、1/3程度まで小さくする。
    const maxSw = compact ? 90 : 280;
    const minSw = compact ? 100 : 200;
    let cols = Math.max(1, Math.floor((inner + gap) / (minSw + gap)));
    cols = Math.min(cols, Math.max(1, colors.length));
    // 列数が少ないと1枚が巨大になるので上限を設ける(1色でも間延びさせない)
    const sw = Math.min(maxSw, Math.floor((inner - gap * (cols - 1)) / cols));
    const rows = Math.ceil(colors.length / cols);
    const cellH = sw + (compact ? 34 : 48); // スウォッチ + 直下のHEXコード
    const titleH = compact ? 44 : 76;
    const barH = compact ? 44 : 92;
    const capH = compact ? 28 : 36;
    const legendH = 54;
    const blockGap = compact ? 16 : 30;
    const barGap = compact ? 8 : 14;
    // コンパクトでは凡例(役割+HEX)を描かないので、その分は高さに含めない。
    // ここを含めたままにすると末尾に空白が残り、狙った縮小率にならない。
    const schemeBlockH = capH + barH + barGap + (compact ? 0 : legendH) + blockGap;
    const schemesH = schemes.length
      ? (compact ? 20 : 46) + schemes.length * schemeBlockH
      : 0;
    const height = pad + titleH + rows * cellH + (rows - 1) * gap + schemesH + pad;
    return { pad, gap, cols, sw, rows, cellH, titleH, barH, capH, legendH, blockGap, barGap, height };
  }

  // パレット資料を ctx の (0, top) から描画し、消費した高さを返す
  function drawPaletteSection(ctx, width, top, colors, schemes, compact = false) {
    const L = paletteLayout(width, colors, schemes, compact);
    let y = top;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, top, width, L.height);

    y += L.pad;
    ctx.fillStyle = '#111111';
    ctx.font = `bold ${compact ? 22 : 34}px system-ui, sans-serif`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText('COLOR PALETTE', L.pad, y);
    y += L.titleH;

    // スウォッチ + HEX
    colors.forEach((c, i) => {
      const col = i % L.cols, row = Math.floor(i / L.cols);
      const x = L.pad + col * (L.sw + L.gap);
      const cy = y + row * (L.cellH + L.gap);
      const r = compact ? 10 : 16;
      ctx.fillStyle = c;
      roundRect(ctx, x, cy, L.sw, L.sw, r);
      ctx.fill();
      ctx.strokeStyle = '#00000018';
      ctx.lineWidth = 2;
      roundRect(ctx, x, cy, L.sw, L.sw, r);
      ctx.stroke();
      // HEXコードはコンパクトでも残す(色を特定できる唯一の情報のため)
      ctx.fillStyle = '#222222';
      ctx.font = `bold ${compact ? 18 : 26}px ui-monospace, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(colorToHex(c), x + L.sw / 2, cy + L.sw + (compact ? 8 : 12));
    });
    y += L.rows * L.cellH + (L.rows - 1) * L.gap;

    // おすすめ配色(60:30:10バー)
    if (schemes.length) {
      y += compact ? 20 : 46;
      schemes.forEach((scheme, idx) => {
        ctx.fillStyle = '#111111';
        ctx.font = `bold ${compact ? 19 : 26}px system-ui, sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(`配色案 ${idx + 1}`, L.pad, y);
        y += L.capH;

        let x = L.pad;
        const barW = width - L.pad * 2;
        scheme.colors.forEach((c, i) => {
          const segW = Math.round(barW * scheme.ratios[i] / 100);
          ctx.fillStyle = c;
          ctx.fillRect(x, y, segW, L.barH);
          // バー内は比率だけを大きく出す。10%枠は狭く、役割名やHEXは入りきらない。
          // コンパクトでは比率も出さず、色の帯だけをシンプルに見せる。
          if (!compact) {
            ctx.fillStyle = readableInk(c);
            ctx.textAlign = 'center';
            ctx.font = 'bold 30px system-ui, sans-serif';
            const pct = `${scheme.ratios[i]}%`;
            if (ctx.measureText(pct).width <= segW - 10) {
              ctx.fillText(pct, x + segW / 2, y + L.barH / 2 - 18);
            }
          }
          x += segW;
        });
        // 端数でバー右端が欠けないよう最後の色で埋める
        if (x < L.pad + barW) {
          ctx.fillStyle = scheme.colors[scheme.colors.length - 1];
          ctx.fillRect(x, y, L.pad + barW - x, L.barH);
        }
        y += L.barH + L.barGap;

        // 凡例: 役割 + HEX。バー内に収まらない情報をここで確実に読めるようにする。
        // コンパクトでは省略する(高さ計算側でも legendH を除外している)
        if (!compact) {
          const legendW = (width - L.pad * 2) / scheme.colors.length;
          scheme.colors.forEach((c, i) => {
            const lx = L.pad + i * legendW;
            ctx.fillStyle = c;
            roundRect(ctx, lx, y + 2, 22, 22, 5);
            ctx.fill();
            ctx.strokeStyle = '#00000022';
            ctx.lineWidth = 1.5;
            roundRect(ctx, lx, y + 2, 22, 22, 5);
            ctx.stroke();
            ctx.textAlign = 'left';
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px system-ui, sans-serif';
            // 役割はベース/アソート/アクセントの3色構成のときだけ意味を持つ
            const role = scheme.colors.length === 3 ? ROLE_LABELS[ROLE_KEYS[i]] : '';
            if (role) ctx.fillText(role, lx + 30, y + 2);
            ctx.fillStyle = '#666666';
            ctx.font = '19px ui-monospace, monospace';
            ctx.fillText(colorToHex(c), lx + 30, y + (role ? 26 : 4));
          });
          y += L.legendH + L.blockGap;
        } else {
          y += L.blockGap;
        }
      });
    }
    return L.height;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 出力用キャンバスを組み立てる。既存キャンバスには一切手を加えない
  function buildExportCanvas(mode) {
    const colors = currentPaletteColors;
    const schemes = colorSchemes;

    if (mode === 'image') {
      return mergeCanvas(); // 現在の画像をそのまま(解像度も維持)
    }

    // パレットの体裁はユーザーの選択に従う(モードによる自動切り替えはしない)
    const compact = exportPaletteSize === 'compact';

    if (mode === 'palette') {
      const L = paletteLayout(EXPORT_W, colors, schemes, compact);
      const out = document.createElement('canvas');
      out.width = EXPORT_W;
      out.height = L.height;
      const ctx = out.getContext('2d');
      drawPaletteSection(ctx, EXPORT_W, 0, colors, schemes, compact);
      return out;
    }

    // both: 上にキャンバス画像、下にパレット
    const img = mergeCanvas();
    const imgH = Math.round(img.height * (EXPORT_W / img.width));
    const L = paletteLayout(EXPORT_W, colors, schemes, compact);
    const out = document.createElement('canvas');
    out.width = EXPORT_W;
    out.height = imgH + L.height;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(img, 0, 0, EXPORT_W, imgH);
    drawPaletteSection(ctx, EXPORT_W, imgH, colors, schemes, compact);
    // 画像とパレットの境界線
    ctx.fillStyle = '#00000018';
    ctx.fillRect(0, imgH, EXPORT_W, 2);
    return out;
  }

  // ---- 出力ポップアップ ----
  function buildExportPopupContent(container) {
    const modes = [
      ['palette', 'パレットのみ'],
      ['image', '画像のみ'],
      ['both', 'パレット＋画像'],
    ];
    const modeRow = document.createElement('div');
    modeRow.className = 'popup-row';
    modeRow.style.flexWrap = 'wrap';
    modes.forEach(([key, label]) => {
      const btn = document.createElement('button');
      btn.className = 'icon-btn pen-btn' + (exportMode === key ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        exportMode = key;
        refreshPopupIfType('export');
      });
      modeRow.appendChild(btn);
    });
    container.appendChild(modeRow);

    // パレットの体裁(「画像のみ」はパレットを描かないので出さない)
    if (exportMode !== 'image') {
      const sizeRow = document.createElement('div');
      sizeRow.className = 'popup-row';
      sizeRow.style.flexWrap = 'wrap';
      const sizeLabel = document.createElement('span');
      sizeLabel.textContent = 'パレット';
      sizeLabel.style.cssText = 'font-size:12px;color:var(--muted);margin-right:2px;';
      sizeRow.appendChild(sizeLabel);
      [['standard', '標準'], ['compact', 'コンパクト']].forEach(([key, label]) => {
        const btn = document.createElement('button');
        btn.className = 'icon-btn pen-btn' + (exportPaletteSize === key ? ' active' : '');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          exportPaletteSize = key;
          refreshPopupIfType('export');
        });
        sizeRow.appendChild(btn);
      });
      container.appendChild(sizeRow);
    }

    // 出力画像を先に作る(保存ボタンとプレビューの両方がこれを使う)
    const out = buildExportCanvas(exportMode);

    const actions = document.createElement('div');
    actions.className = 'popup-row';

    // 共有が使える環境でのみ表示する案内(初期は非表示、判定後に出す)
    const shareNote = document.createElement('div');
    shareNote.style.cssText = 'font-size:12px;color:var(--muted);line-height:1.5;margin:2px 0 8px;display:none;';
    shareNote.textContent = isIOS
      ? '共有シートが開いたら「画像を保存」を選んでください。カメラロールに保存されます。'
      : '共有シートが開きます。保存先はお使いの環境によって異なります。';

    const saveOut = document.createElement('button');
    saveOut.className = 'icon-btn pen-btn with-label';
    saveOut.innerHTML = icon('save', '保存');

    // 共有シート(iOSなら「画像を保存」でカメラロールに入る)を確実に開くため、
    // ポップアップを開いた時点で画像を準備しておく。
    // navigator.share() はタップ直後に呼ばないと拒否されるため、
    // toBlob() の完了を待ってから呼ぶ形にはできない。
    let exportFile = null;
    out.toBlob((blob) => {
      if (!blob) return;
      const f = new File([blob], `color-cage-${Date.now()}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        exportFile = f;
        saveOut.innerHTML = icon('save', isIOS ? '写真に保存' : '保存・共有');
        if (shareNote) shareNote.style.display = '';
      }
    }, 'image/png');

    saveOut.addEventListener('click', () => {
      // 準備できていれば共有シートを直接開く(ここで await を挟まない)
      if (exportFile) {
        navigator.share({ files: [exportFile], title: 'Color Cage' })
          .catch((err) => {
            if (err && err.name === 'AbortError') return; // ユーザーが閉じただけ
            exportCanvas(out); // 共有が使えない場合は従来の導線へ
          });
        // 共有シートは何を押せばよいか分かりにくいので、背後の案内を目立たせる。
        // シートを閉じて戻ってきたときにも見えるよう、表示は消さない。
        shareNote.style.display = '';
        shareNote.style.color = 'var(--ink)';
        shareNote.style.fontWeight = '600';
        return;
      }
      // 未対応環境・準備前はダウンロード等の従来処理
      exportCanvas(out);
    });
    actions.appendChild(saveOut);

    // クリップボードコピーは対応環境でのみ出す(iOS Safariは未対応のことが多い)
    if (navigator.clipboard && window.ClipboardItem) {
      const copyOut = document.createElement('button');
      copyOut.className = 'icon-btn pen-btn with-label';
      copyOut.innerHTML = icon('copy', 'コピー');
      copyOut.addEventListener('click', () => {
        out.toBlob(async (blob) => {
          if (!blob) return;
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            copyOut.innerHTML = icon('check', 'コピー済');
            setTimeout(() => { copyOut.innerHTML = icon('copy', 'コピー'); }, 1500);
          } catch (err) {
            copyOut.innerHTML = icon('alert', '失敗');
            setTimeout(() => { copyOut.innerHTML = icon('copy', 'コピー'); }, 1500);
          }
        }, 'image/png');
      });
      actions.appendChild(copyOut);
    }
    // 操作ボタンは設定のすぐ下に置く(プレビューが長いと下端まで届かないため)
    container.appendChild(actions);
    container.appendChild(shareNote);

    // プレビュー(確認用なので最後に置く)
    const preview = document.createElement('img');
    preview.src = out.toDataURL('image/png');
    preview.style.cssText = 'width:100%;height:auto;display:block;margin:10px 0 0;border-radius:10px;background:#fff;';
    container.appendChild(preview);
  }

  // 既存の保存導線(共有 → ダウンロード → iOSは別タブ表示)を出力全体で共用する
  function exportCanvas(out) {
    const filename = `color-cage-${Date.now()}.png`;
    out.toBlob(async (blob) => {
      if (!blob) return fallbackOpenTab(out);

      const file = new File([blob], filename, { type: 'image/png' });
      const canUseShare = navigator.canShare && navigator.canShare({ files: [file] });

      if (canUseShare) {
        try {
          await navigator.share({ files: [file], title: 'Color Cage' });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      if (isIOS) {
        fallbackOpenTab(out);
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
    }, 'image/png');
  }

  bgColorBtn.addEventListener('click', () => openPopup('bgColor', 'キャンバス背景色', buildBgColorPopupContent));

  saveBtn.addEventListener('click', () => openPopup('export', '出力', buildExportPopupContent));

  function fallbackOpenTab(canvasEl) {
    const w = window.open('', '_blank');
    if (!w) return;
    const dataUrl = canvasEl.toDataURL('image/png');
    w.document.write(
      `<title>Color Cage 保存</title>
       <body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;">
       <p style="position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-family:sans-serif;font-size:14px;">画像を長押しして「写真に保存」を選んでください</p>
       <img src="${dataUrl}" style="max-width:100%;height:auto;">
       </body>`
    );
  }

  // 画面回転やウィンドウサイズ変更では、キャンバスの解像度は変更しない。
  // 解像度が変わるのは設定でサイズを指定したときと画像インポート時だけ。
  // ここでは表示領域の形が変わるため、全体が見えるよう倍率だけ合わせ直す。
  window.addEventListener('resize', () => {
    fitCanvasToView();
  });

  // ---------- 初期化 ----------
  // キャンバスを作る前に、ツールバーを畳んだ状態の表示領域を測っておく。
  // これを基準にすることで、描画中にツールバーを開閉してもサイズが変わらない。
  fitScreenBaseSize = measureFitScreenBaseSize();
  resizeAllCanvases();
  updateCanvasSizeLabel();
  applyDefaultButtonVisibility();
  applyPaletteModeUI();
  applyMiniColorRowVisibility();
  applyPalette();
  // 初期表示はキャンバス全体が見える倍率にする
  fitCanvasToView();
  setTool('pen');
})();
</script>

</body>
</html>
